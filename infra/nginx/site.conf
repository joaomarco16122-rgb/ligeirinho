# Static website only. No API or database credentials belong in this image.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format site '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout site;
    server_tokens off;
    sendfile on;
    keepalive_timeout 15;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_body_temp_path /tmp/client_body_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=(self)' always;

        location = /api/v1 {
            default_type application/json;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            return 503 '{"error":"API_INDISPONIVEL","message":"A API operacional ainda não está conectada a este site estático."}';
        }
        location ^~ /api/v1/ {
            default_type application/json;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            return 503 '{"error":"API_INDISPONIVEL","message":"A API operacional ainda não está conectada a este site estático."}';
        }
        location ^~ /_next/static/ {
            expires 1y;
            try_files $uri =404;
        }
        location ~ (^|/)\. {
            return 404;
        }
        location / {
            try_files $uri $uri.html $uri/index.html =404;
        }
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }
}
